# Puts the newest release's update site (update-site.tar.gz) on GitHub Pages.
# Started by Homeport's tools/publish-updates.sh after it makes a release.
name: Publish the update site
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read   # the deploy step looks up the uploaded site among this run's files
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the site from the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern update-site.tar.gz --dir .
          mkdir site
          tar -xzf update-site.tar.gz -C site
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub sometimes doesn't list the uploaded site yet when the next step asks for it.
      - name: Give GitHub a moment to list the uploaded site
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v5

